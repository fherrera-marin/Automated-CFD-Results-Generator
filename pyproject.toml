[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-surrogate-models-wind-turbine-blades"
version = "0.1.0"
description = "CFD surrogate models for wind turbine blades"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "cadquery",
    "scikit-learn",
    "pandas",
    "shapely",
]

[project.optional-dependencies]
web = [
    "django>=5",
    "djangorestframework",
    "celery[redis]",
    "redis",
    "django-cors-headers",
    "django-environ",
]
